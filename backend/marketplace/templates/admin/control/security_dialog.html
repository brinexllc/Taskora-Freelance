<dialog class="ta-security-dialog" id="ta-security-dialog"><button class="ta-dialog-close ta-icon-button" type="button" data-close-dialog aria-label="Закрыть">×</button><span class="ta-empty-icon"><svg class="ta-icon"><use href="#ta-shield"/></svg></span><h2>Подтвердите безопасность</h2><p>Введите пароль и новый код из приложения-аутентификатора. Подтверждение действует 5 минут.</p><form class="ta-security-form">{% csrf_token %}<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><label>TOTP-код<input name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></label><button class="ta-button" type="submit">Подтвердить</button><p role="status" aria-live="polite" class="ta-security-status"></p></form></dialog>
